# === Configuracion dual: MySQL (local) / H2 (Render) ===
# Local: usa MySQL de XAMPP
# Render: setea SPRING_DATASOURCE_URL=jdbc:h2:mem:sistema_inventario

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sistema_inventario}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 console (solo si se usa H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080
