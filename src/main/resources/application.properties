# === Configuracion dual: MySQL (local) / H2 (Render) ===
# En Render usa H2 por defecto. Para local, setea las env vars de MySQL.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sistema_inventario}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 console (solo si se usa H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080
