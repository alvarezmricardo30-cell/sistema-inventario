<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
        }
        .register-header {
            background: linear-gradient(135deg, #2563eb 0%, #16a34a 100%);
            color: white;
            padding: 35px 30px;
            text-align: center;
        }
        .register-header i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }
        .register-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .register-header p {
            opacity: 0.9;
            font-size: 0.95rem;
            margin: 0;
        }
        .register-body {
            padding: 35px 30px;
        }
        .form-floating label {
            color: #6b7280;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }
        .btn-register {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(22, 163, 74, 0.3);
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="register-header">
            <i class="bi bi-person-plus-fill"></i>
            <h1>Crear Cuenta</h1>
            <p>Registrate para acceder al Sistema de Inventario</p>
        </div>
        <div class="register-body">
            <div id="alerta" class="alert alert-danger d-none" role="alert"></div>
            <div id="alertaExito" class="alert alert-success d-none" role="alert"></div>

            <form id="registerForm" onsubmit="registrarUsuario(event)">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="nombre" placeholder="Nombre completo" required>
                    <label for="nombre"><i class="bi bi-person-badge me-1"></i>Nombre completo</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="Usuario" required>
                    <label for="username"><i class="bi bi-person me-1"></i>Usuario</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Correo electronico">
                    <label for="email"><i class="bi bi-envelope me-1"></i>Correo electronico (opcional)</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Contrasena" required minlength="4">
                    <label for="password"><i class="bi bi-lock me-1"></i>Contrasena</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirmar contrasena" required minlength="4">
                    <label for="confirmPassword"><i class="bi bi-lock-fill me-1"></i>Confirmar contrasena</label>
                </div>
                <button type="submit" class="btn btn-register btn-success w-100 text-white">
                    <i class="bi bi-check-circle me-2"></i>Crear Cuenta
                </button>
            </form>

            <div class="login-link">
                <p class="text-muted mb-0">Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p>
            </div>
        </div>
    </div>

    <script>
        async function registrarUsuario(e) {
            e.preventDefault();
            const alerta = document.getElementById('alerta');
            const alertaExito = document.getElementById('alertaExito');
            alerta.classList.add('d-none');
            alertaExito.classList.add('d-none');

            const nombre = document.getElementById('nombre').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alerta.textContent = 'Las contrasenas no coinciden';
                alerta.classList.remove('d-none');
                return;
            }

            try {
                const resp = await fetch('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, username, email, password })
                });

                const data = await resp.json();

                if (resp.ok) {
                    alertaExito.textContent = 'Cuenta creada correctamente. Redirigiendo al login...';
                    alertaExito.classList.remove('d-none');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    alerta.textContent = data.error || 'Error al crear la cuenta';
                    alerta.classList.remove('d-none');
                }
            } catch (err) {
                alerta.textContent = 'Error de conexion con el servidor';
                alerta.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
