# === Configuracion dual: MySQL (local) / PostgreSQL (Render) ===
# Si SPRING_DATASOURCE_URL empieza con jdbc:mysql usa MySQL
# Si SPRING_DATASOURCE_URL empieza con jdbc:postgresql usa PostgreSQL
# Si no hay SPRING_DATASOURCE_URL usa H2 embebida

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sistema_inventario}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 console (debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.port=8080
