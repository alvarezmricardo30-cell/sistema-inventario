<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        .login-header {
            background: linear-gradient(135deg, #2563eb 0%, #16a34a 100%);
            color: white;
            padding: 35px 30px;
            text-align: center;
        }
        .login-header i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }
        .login-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .login-header p {
            opacity: 0.9;
            font-size: 0.95rem;
            margin: 0;
        }
        .login-body {
            padding: 35px 30px;
        }
        .form-floating label {
            color: #6b7280;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .demo-info {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #166534;
        }
        .demo-info strong {
            display: block;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-cpu-fill"></i>
            <h1>Sistema de Inventario</h1>
            <p>SEN.A - Tecnologo en ADSO</p>
        </div>
        <div class="login-body">
            <div class="demo-info">
                <i class="bi bi-info-circle me-1"></i>
                <strong>Datos para probar:</strong>
                Usuario: <strong>admin</strong> | Contraseña: <strong>1234</strong>
            </div>

            <div id="alerta" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm" onsubmit="iniciarSesion(event)">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="Usuario" required autofocus>
                    <label for="username"><i class="bi bi-person me-1"></i>Usuario</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" placeholder="Contrasena" required>
                    <label for="password"><i class="bi bi-lock me-1"></i>Contrasena</label>
                </div>
                <button type="submit" class="btn btn-login btn-primary w-100 text-white">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesion
                </button>
            </form>

            <div class="register-link">
                <p class="text-muted mb-0">No tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
            </div>
        </div>
    </div>

    <script>
        async function iniciarSesion(e) {
            e.preventDefault();
            const alerta = document.getElementById('alerta');
            alerta.classList.add('d-none');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await resp.json();

                if (resp.ok) {
                    window.location.href = '/index.html';
                } else {
                    alerta.textContent = data.error || 'Usuario o contrasena incorrectos';
                    alerta.classList.remove('d-none');
                }
            } catch (err) {
                alerta.textContent = 'Error de conexion con el servidor';
                alerta.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
